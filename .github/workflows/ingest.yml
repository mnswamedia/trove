name: Trove Media Ingestion

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'YouTube video URLs or IDs (space or line separated)'
        required: true
        type: string
      format:
        description: 'Output format (m4a or mp4)'
        required: true
        default: 'm4a'
        type: choice
        options:
          - m4a
          - mp4
      bucket_id:
        description: 'Target Hugging Face Bucket ID'
        required: false
        default: 'mnswa/trove_dataset'
        type: string
      hf_token:
        description: 'Optional Hugging Face Token (if not using repository secret)'
        required: false
        default: ''
        type: string

jobs:
  ingest:
    name: Download & Ingest Media
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (EJS Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          pip install --no-cache-dir yt-dlp "huggingface_hub>=0.22.0" requests PySocks mutagen

      - name: Set up Cloudflare WARP (High-Speed SOCKS5 Tunnel)
        run: |
          echo "--> Installing Cloudflare WARP client..."
          SUITE=$(lsb_release -cs 2>/dev/null || echo "noble")
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $SUITE main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # Fast update of only Cloudflare repo
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" || {
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          }
          sudo apt-get install -y --no-install-recommends cloudflare-warp

          # Start daemon
          sudo systemctl start warp-svc 2>/dev/null || sudo warp-svc &
          sleep 2

          # Configure local SOCKS5 proxy on port 40000
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos mode proxy 2>/dev/null || warp-cli --accept-tos set-mode proxy 2>/dev/null || true
          warp-cli --accept-tos proxy port 40000 2>/dev/null || warp-cli --accept-tos set-proxy-port 40000 2>/dev/null || true
          warp-cli --accept-tos connect 2>/dev/null || true
          sleep 3

          # Export proxy env var for runner script
          echo "WARP_PROXY=socks5://127.0.0.1:40000" >> $GITHUB_ENV
          curl -s --socks5 127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | head -n 6 || echo "WARP starting up..."

      - name: Run Ingest Script
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          MEDIA_FORMAT: ${{ github.event.inputs.format }}
          BUCKET_ID: ${{ github.event.inputs.bucket_id != '' && github.event.inputs.bucket_id || 'mnswa/trove_dataset' }}
          HF_TOKEN: ${{ github.event.inputs.hf_token != '' && github.event.inputs.hf_token || secrets.HF_TOKEN }}
        run: |
          python3 scripts/ingest.py

