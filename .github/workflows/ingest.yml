name: Trove Media Ingestion

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'YouTube video URLs or IDs (space or line separated; optional if backfilling)'
        required: false
        default: ''
        type: string
      format:
        description: 'Output format (m4a or mp4)'
        required: true
        default: 'm4a'
        type: choice
        options:
          - m4a
          - mp4
      backfill:
        description: 'Rebuild downloads.json from existing bucket metadata (true/false)'
        required: false
        default: false
        type: boolean
      bucket_id:
        description: 'Target Hugging Face Bucket ID'
        required: false
        default: 'mnswa/trove_dataset'
        type: string
      hf_token:
        description: 'Optional Hugging Face Token (if not using repository secret)'
        required: false
        default: ''
        type: string

jobs:
  ingest:
    name: Download & Ingest Media
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mnswamedia/trove-ingest:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ingest Script (with WARP)
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          MEDIA_FORMAT: ${{ github.event.inputs.format }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          BUCKET_ID: ${{ github.event.inputs.bucket_id != '' && github.event.inputs.bucket_id || 'mnswa/trove_dataset' }}
          HF_TOKEN: ${{ github.event.inputs.hf_token != '' && github.event.inputs.hf_token || secrets.HF_TOKEN }}
          WARP_WG_CONF: ${{ secrets.WARP_WG_CONF }}
        run: run-with-warp python3 scripts/ingest.py
